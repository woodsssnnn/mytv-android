name: daily-source
on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: oldman, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: pools
        run: |
          mkdir -p pools _work live
          for p in "mytv-android/iptv-api/master/output/result.m3u iptvapi" "iptv-org/iptv/master/streams/cn_cctv.m3u iptvorg-cctv" "iptv-org/iptv/master/streams/cn.m3u iptvorg-cn" "live.fanmingming.com/e.m3u fanmingming"; do
            set -- $p; curl -sfL --max-time 60 -o "pools/$2.m3u" "https://raw.githubusercontent.com/$1" || curl -sfL --max-time 60 -o "pools/$2.m3u" "https://$1" || true
          done
          cat pools/*.m3u > _work/all.m3u
      - name: candidates
        run: |
          python -c "
          import io
          L=io.open('_work/all.m3u',encoding='utf-8',errors='replace').read().splitlines()
          o=[];i=0
          while i<len(L):
            if L[i].startswith('#EXTINF'):
              n=L[i][L[i].rfind(',')+1:].strip(); j=i+1
              while j<len(L) and L[j].strip().startswith('#'): j+=1
              u=L[j].strip() if j<len(L) else ''
              if u: o.append(n+'\t'+u)
              i=j+1
            else: i+=1
          io.open('_work/candidates.tsv','w',encoding='utf-8').write('\n'.join(o))"
      - name: probe
        run: |
          sed 's/\t/|/' _work/candidates.tsv | xargs -P 20 -I{} bash -c 'I="{}"; n="${I%%|*}"; u="${I#*|}"; read -r c l < <(curl -o /dev/null -s -L -m 9 --connect-timeout 5 -r 0-2047 -w "%{http_code} %{time_total}" "$u" 2>/dev/null || echo "ERR 99"); echo -e "$c\t$l\t$n\t$u"' > _work/probe.tsv || true
      - name: identity check (experimental, content consistency)
        run: |
          awk -F'\t' '$1>=200 && $1<400 {print $3"\t"$4}' _work/probe.tsv | sort -u > _work/alive.tsv
          sudo apt-get -y install ffmpeg tesseract-ocr >/dev/null 2>&1 || true
          python -m pip install --quiet pillow
          # 台标模板哈希: runner 可达 fanmingming 台标库, 抓模板图与流帧同法哈希
          TPL_HASHES=$(python - <<'EOF'
          import urllib.request, io, sys, hashlib
          sys.path.insert(0, 'scripts')
          try:
              from verify_identity import dhash
              from PIL import Image
              outs = []
              for name in ['CCTV1','CCTV2','CCTV13','CCTV14','湖南卫视','东方卫视']:
                  try:
                      d = urllib.request.urlopen(f'https://live.fanmingming.com/tv/{name}.png', timeout=8).read()
                      im = Image.open(io.BytesIO(d)).convert('RGBA')
                      bg = Image.new('RGBA', im.size, (0,0,0,255)); bg.alpha_composite(im)
                      outs.append(f'{name}:{dhash(bg.convert("RGB"))}')
                  except Exception: pass
              print(','.join(outs))
          except Exception: print('')
          EOF
          )
          export TPL_HASHES
          cat _work/alive.tsv | python scripts/verify_identity.py > _work/identity.tsv || true
          echo "identity: ok=$(grep -c '	ok$' _work/identity.tsv 2>/dev/null || echo 0) mismatch=$(grep -c '	mismatch' _work/identity.tsv 2>/dev/null || echo 0)"
      - name: build
        run: |
          # identity 预过滤: mismatch(串台/测试卡)剔除; identity 缺失时用原始候选
          if [ -s _work/identity.tsv ]; then
            awk -F'\t' 'NR==FNR { v[$1]=$2; next } { vn=v[$2]; if (vn=="mismatch") next; print $1"\t"$2 }' _work/identity.tsv _work/candidates.tsv > _work/candidates-verified.tsv
          else
            cp _work/candidates.tsv _work/candidates-verified.tsv
          fi
          PROBE_FILE=_work/probe.tsv python scripts/build_source.py < _work/candidates-verified.tsv > live/old-man-tv.m3u
          curl -sfL --max-time 120 -o _work/e.xml https://live.fanmingming.com/e.xml || curl -sfL --max-time 120 -o _work/e.xml https://raw.githubusercontent.com/fanmingming/live/main/e.xml || true
          [ -s _work/e.xml ] && python scripts/build_epg.py < _work/e.xml | gzip > live/epg.xml.gz || true
      - name: upload (default, private-to-you)
        uses: actions/upload-artifact@v4
        with:
          name: oldman-live-${{ github.run_number }}
          path: |
            live/
            _work/identity.tsv
            _work/probe.tsv
      - name: push to your private repo (optional)
        env:
          DEST_REPO: ${{ secrets.DEST_REPO }}
          DEST_TOKEN: ${{ secrets.DEST_TOKEN }}
        run: |
          if [ -z "$DEST_REPO" ] || [ -z "$DEST_TOKEN" ]; then echo "skip: secrets not configured"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf dest && git clone --depth 1 "https://x-access-token:${DEST_TOKEN}@github.com/${DEST_REPO}.git" dest
          mkdir -p dest/live && cp live/* dest/live/ && cd dest
          git add -A && git commit -m "daily $(date -u +%F)" || echo no-changes
          git push
